events {}

http {
  # Docker's embedded DNS. Upstream names are resolved per request through the
  # variables below rather than once at startup, because nginx treats a literal
  # host in `proxy_pass` as a config error it cannot recover from: if a single
  # service is not resolvable when nginx boots it exits with
  #   [emerg] host not found in upstream "auth-service"
  # and the whole gateway stays down, taking every other service with it. With
  # a variable, an unreachable service is a 502 on its own routes and nothing
  # more.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    location = / {
      default_type text/plain;
      return 200 'Niklo API stack is running';
    }

    location /api/v1/auth {
      set $upstream_auth http://auth-service:3001;
      proxy_pass $upstream_auth$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/bus {
      set $upstream_bus http://bus-service:3003;
      proxy_pass $upstream_bus$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/payment {
      set $upstream_payment http://payment-service:3007;
      proxy_pass $upstream_payment$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/hotels {
      set $upstream_hotel http://hotel-service:3004;
      proxy_pass $upstream_hotel$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/location {
      set $upstream_hotel_location http://hotel-service:3004;
      proxy_pass $upstream_hotel_location$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/bookings/hotel {
      set $upstream_hotel_bookings http://hotel-service:3004;
      proxy_pass $upstream_hotel_bookings$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/bookings {
      set $upstream_booking http://booking-service:3014;
      proxy_pass $upstream_booking$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/user {
      set $upstream_user http://user-service:3002;
      proxy_pass $upstream_user$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/users {
      set $upstream_users http://user-service:3002;
      proxy_pass $upstream_users$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/ride {
      set $upstream_ride http://ride-service:3005;
      proxy_pass $upstream_ride$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/driver {
      set $upstream_driver http://driver-service:3011;
      proxy_pass $upstream_driver$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/packages {
      set $upstream_package http://package-service:3012;
      proxy_pass $upstream_package$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/adventure {
      set $upstream_adventure http://adventure-service:3013;
      proxy_pass $upstream_adventure$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/adventures {
      set $upstream_adventures http://adventure-service:3013;
      proxy_pass $upstream_adventures$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/notify {
      set $upstream_notify http://notification-service:3009;
      proxy_pass $upstream_notify$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/notifications {
      set $upstream_notifications http://notification-service:3009;
      proxy_pass $upstream_notifications$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # `location /swagger` previously paired with `proxy_pass .../swagger`, which
    # replaced the matched prefix with an identical one — so passing the request
    # URI through unchanged is the same thing.
    location /swagger {
      set $upstream_swagger http://admin-service:3020;
      proxy_pass $upstream_swagger$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The only route that genuinely rewrites: `/admin/x` reaches admin-service
    # as `/x`. A variable `proxy_pass` does not strip the location prefix on its
    # own, so the rewrite below does it explicitly and nginx forwards the
    # rewritten URI.
    location /admin/ {
      set $upstream_admin http://admin-service:3020;
      rewrite ^/admin/(.*)$ /$1 break;
      proxy_pass $upstream_admin;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # WebSockets support
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
    }

    # Prefix and target were identical here too, so the URI passes through.
    location /api/v1/admin/ {
      set $upstream_admin_api http://admin-service:3020;
      proxy_pass $upstream_admin_api$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
